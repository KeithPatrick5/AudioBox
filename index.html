<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070707" />
  <meta name="description" content="AudioBox — a cinematic audiobook streaming experience." />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>AudioBox</title>
  <link rel="preconnect" href="https://archive.org" crossorigin />
  <link rel="preconnect" href="https://covers.openlibrary.org" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell">
    <header class="topbar" id="topbar">
      <button class="brand" data-nav="home" aria-label="AudioBox home"><span>Audio</span><b>Box</b></button>
      <nav class="navlinks" aria-label="Primary">
        <button class="navlink active" data-nav="home">Home</button>
        <button class="navlink" data-nav="browse">Browse</button>
        <button class="navlink" data-nav="mylist">My List</button>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchToggle" aria-label="Search"><span class="i-search"></span></button>
      </div>
    </header>

    <section class="search-panel" id="searchPanel" aria-hidden="true">
      <div class="search-box">
        <span class="i-search"></span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Titles or authors" aria-label="Search audiobooks" />
        <button class="icon-btn" id="searchClose" aria-label="Close search">×</button>
      </div>
      <div class="search-meta" id="searchMeta">Search the AudioBox catalog</div>
      <div class="grid" id="searchResults"></div>
    </section>

    <main id="main">
      <section id="homeView" class="view active"></section>
      <section id="browseView" class="view"></section>
      <section id="myListView" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <article class="detail-modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="detailContent"></div>
    </article>
  </div>

  <aside class="player" id="player" aria-hidden="true">
    <div class="player-book">
      <div class="player-cover"><img id="playerCover" alt="" /></div>
      <div class="player-meta">
        <strong id="playerTitle">Nothing playing</strong>
        <span id="playerChapter"></span>
      </div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="player-btn" id="prevChapter" aria-label="Previous chapter">⏮</button>
        <button class="play-main" id="playToggle" aria-label="Play">▶</button>
        <button class="player-btn" id="nextChapter" aria-label="Next chapter">⏭</button>
      </div>
      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-tools">
      <button class="tool-btn" id="speedBtn" title="Playback speed">1×</button>
      <button class="tool-btn" id="sleepBtn" title="Sleep timer">☾</button>
      <span class="volume-icon">▾</span>
      <input id="volume" type="range" min="0" max="1" step="0.02" value="0.9" aria-label="Volume" />
      <button class="tool-btn" id="playerExpand" aria-label="Open book details">⌃</button>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
