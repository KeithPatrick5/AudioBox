name: Fix AudioBox app hash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-app-hash.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact app.js bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "['Romance',bestEditions(rowResults[4])],\n \n      ...(fav.length?"
          new = "['Romance',bestEditions(rowResults[4])],\n      ...(fav.length?"
          if old not in s:
              raise SystemExit('Expected assembly boundary not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-app-hash.yml
          git add app.js
          git commit -m "Restore exact AudioBox app source"
          git push
