name: Assemble AudioBox

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble frontend
        run: |
          cat .upload/app.js.part00 .upload/app.js.part01 .upload/app.js.part02 .upload/app.js.part03 > app.js
          cat .upload/styles.css.part00 .upload/styles.css.part01 > styles.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .upload
          git rm .github/workflows/assemble.yml
          git add app.js styles.css
          git commit -m "Assemble AudioBox frontend"
          git push
