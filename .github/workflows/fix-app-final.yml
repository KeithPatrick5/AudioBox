name: Finalize AudioBox app bytes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-app-final.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore final exact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "for(const [action,fn] of Object.entries(handlers)){try{navigator.mediaSession.setActionHandler(action,fn)}catch{}}\n\n  }"
          new = "for(const [action,fn] of Object.entries(handlers)){try{navigator.mediaSession.setActionHandler(action,fn)}catch{}}\n  }"
          if old not in s:
              raise SystemExit('Expected final assembly boundary not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-app-final.yml
          git add app.js
          git commit -m "Finalize exact AudioBox source"
          git push
